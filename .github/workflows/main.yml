name: Peblo TV Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '20'
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Lint Backend
        run: |
          pip install ruff
          ruff check api/
      - name: Lint Frontend
        run: |
          cd cms && npm ci && npm run lint
          cd ../viewer && npm ci && npm run lint

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Run Backend Tests
        run: |
          pip install -r api/requirements.txt
          python -m pytest api/test_main.py -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Docker Images
        run: |
          docker build -t peblo/api ./api
          docker build -t peblo/cms ./cms
          docker build -t peblo/viewer ./viewer
          
